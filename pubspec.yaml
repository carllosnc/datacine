name: datacine
description: Movie catalog.
publish_to: "none"

version: 1.0.0+28
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  collection: ^1.19.1
  url_launcher: ^6.3.1
  transparent_image: ^2.0.1
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  shorebird_code_push: ^1.1.6

  # packages from git
  imgy:
    git:
      url: https://github.com/carllosnc/imgy.git

  vw:
    git:
      url: https://github.com/carllosnc/vw.git

  validatorless: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  test: ^1.25.15

flutter:
  uses-material-design: true

  assets:
    - ./assets/images/extended_logo.png
    - ./assets/images/no_poster.png
    - ./assets/images/no_backdrop.png
    - ./assets/images/no_profile.png
    - ./assets/images/welcome.webp
    - ./assets/images/logo_symbol.webp
    - ./assets/images/logo_full.webp
    - shorebird.yaml

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Ultralight.ttf
          weight: 100
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-UltralightItalic.ttf
          weight: 100
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Thin.ttf
          weight: 200
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-ThinItalic.ttf
          weight: 200
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Light.ttf
          weight: 300
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-LightItalic.ttf
          weight: 300
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Regular.ttf
          weight: 400
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Medium.ttf
          weight: 500
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Semibold.ttf
          weight: 600
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-SemiboldItalic.ttf
          weight: 600
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Bold.ttf
          weight: 700
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Heavy.ttf
          weight: 800
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-HeavyItalic.ttf
          weight: 800
          style: italic
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-Black.ttf
          weight: 900
        - asset: ./assets/fonts/SF-Pro-Display/SFProDisplay-BlackItalic.ttf
          weight: 900
          style: italic
