name: Datacine

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.13.0"
      - uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_TMDB_AUTH_TOKEN_V3: ${{ secrets.TMDB_AUTH_TOKEN_V3 }}
          envkey_TMDB_AUTH_TOKEN_V4: ${{ secrets.TMDB_AUTH_TOKEN_V4 }}
          filename: .env
      - run: cat .env
      - run: flutter pub get
      - run: flutter test
